appId: com.dshstudio.desktop
productName: DSH Studio
# 图标源：取自 dsh web 的 /favicon.svg（爪印 logo，2026-08-16 抓取）光栅化。
# build/icon.png (1024x1024) 由 electron-builder 自动生成 .icns/.ico。
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 出厂 dsh-runtime 注入：electron-builder 的 file-copy 会过滤顶层 node_modules，
# 所以不使用 extraResources，改由 afterPack 钩子（scripts/afterPack.cjs）在 pack
# 后整体拷贝 resources/dsh-runtime → app Resources/dsh-runtime。
# 由 src/main/runtime.ts（resolveRuntime）在启动时定位。
afterPack: scripts/afterPack.cjs
mac:
  category: public.app-category.developer-tools
  # 优先用本地 iconutil 生成的 icns（避免 electron-builder 联网下转换工具）
  icon: build/icon.icns
  target:
    - dir
win:
  # Windows 打包在对应 OS 上进行（本仓库目前不跑 win 产物）
  icon: build/icon.png
  target:
    - dir
linux:
  icon: build/icon.png
  target:
    - dir
npmRebuild: false
electronDownload:
  # 若需镜像（国内网络）取消注释：
  # mirror: https://npmmirror.com/mirrors/electron/
